<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Repo Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
        
        .search-container {
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 16px;
        }
        
        .search-box button {
            padding: 12px 30px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .search-box button:hover {
            background: #2ea043;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .filters label {
            color: #8b949e;
        }
        
        .filters select {
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
        }
        
        .repo-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        
        .repo-card:hover {
            transform: translateY(-2px);
            border-color: #58a6ff;
        }
        
        .repo-name {
            color: #58a6ff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .repo-name:hover {
            text-decoration: underline;
        }
        
        .repo-description {
            color: #8b949e;
            margin: 10px 0;
        }
        
        .repo-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #8b949e;
        }
        
        .language-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #1f6feb;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .error {
            background: #da3633;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .load-more {
            text-align: center;
            margin: 30px 0;
        }
        
        .load-more button {
            padding: 12px 40px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .load-more button:hover {
            background: #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 GitHub Repository Finder</h1>
            <p style="color: #8b949e;">Search and explore GitHub repositories</p>
        </div>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search repositories..." 
                       onkeypress="if(event.key==='Enter') performSearch()">
                <button onclick="performSearch()">Search</button>
            </div>
            
            <div class="filters">
                <label>Sort by:</label>
                <select id="sortSelect" onchange="performSearch()">
                    <option value="stars">⭐ Stars</option>
                    <option value="forks">🔱 Forks</option>
                    <option value="updated">🕒 Recently Updated</option>
                </select>
            </div>
        </div>
        
        <div id="errorMessage"></div>
        <div id="repoList"></div>
        <div id="loadMoreContainer"></div>
    </div>

    <script>
        let currentPage = 1;
        let currentQuery = '';
        let currentSort = 'stars';
        let totalResults = 0;

        // Get references to DOM elements
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const repoList = document.getElementById('repoList');
        const errorMessage = document.getElementById('errorMessage');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        
        /**
         * Fetches repositories from the GitHub API.
         */
        async function searchRepositories(query, sort = 'stars', page = 1) {
            const API_URL = `https://api.github.com/search/repositories?q=${query}&sort=${sort}&page=${page}&per_page=10`;
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('API rate limit exceeded. Please wait and try again.');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching repositories:', error);
                throw error; // Re-throw to be caught by the calling function
            }
        }
        
        /**
         * Displays repository cards on the page.
         */
        function displayRepositories(repos, append = false) {
            if (!append) {
                repoList.innerHTML = ''; // Clear existing results for a new search
            }

            if (repos.length === 0 && !append) {
                repoList.innerHTML = `<div class="loading">No repositories found for "${currentQuery}".</div>`;
                return;
            }
            
            let html = '';
            repos.forEach(repo => {
                html += createRepoCard(repo);
            });
            
            repoList.innerHTML += html;
        }
        
        /**
         * Creates the HTML for a single repository card.
         */
        function createRepoCard(repo) {
            const description = repo.description ? repo.description : 'No description provided.';
            const language = repo.language ? `<span class="language-badge" style="background-color: #1f6feb;">${repo.language}</span>` : ''; // Simple badge, can be improved with language colors
            
            return `
                <div class="repo-card">
                    <h3>
                        <a href="${repo.html_url}" target="_blank" class="repo-name">
                            ${repo.owner.login} / ${repo.name}
                        </a>
                    </h3>
                    <p class="repo-description">${description}</p>
                    <div class="repo-meta">
                        <span>⭐ ${formatNumber(repo.stargazers_count)} Stars</span>
                        <span>🔱 ${formatNumber(repo.forks_count)} Forks</span>
                        ${language}
                    </div>
                </div>
            `;
        }
        
        /**
         * Initiates a new search when the user clicks the search button or changes the sort.
         */
        async function performSearch() {
            const query = searchInput.value.trim();
            const sort = sortSelect.value;

            if (query === "") {
                showError("Please enter a search term.");
                return;
            }
            
            clearError();
            repoList.innerHTML = `<div class="loading">🔍 Searching for repositories...</div>`;
            loadMoreContainer.innerHTML = ''; // Clear "Load More" button

            currentPage = 1;
            currentQuery = query;
            currentSort = sort;

            try {
                const data = await searchRepositories(currentQuery, currentSort, currentPage);
                totalResults = data.total_count;
                
                displayRepositories(data.items, false);
                
                // Check if there are more results to load
                updateLoadMoreButton(data.items.length);
                
            } catch (error) {
                showError(error.message);
                repoList.innerHTML = ''; // Clear loading message
            }
        }
        
        /**
         * Loads the next page of results.
         */
        async function loadMore() {
            currentPage++;
            
            const button = document.getElementById('loadMoreBtn');
            if (button) {
                button.textContent = 'Loading...';
                button.disabled = true;
            }

            try {
                const data = await searchRepositories(currentQuery, currentSort, currentPage);
                
                displayRepositories(data.items, true);
                
                // Update or remove the "Load More" button
                updateLoadMoreButton(repoList.children.length); // Pass the new total displayed
                
            } catch (error) {
                showError(error.message);
                // Re-enable button on error
                if (button) {
                    button.textContent = 'Load More';
                    button.disabled = false;
                }
            }
        }

        /**
         * Adds or removes the "Load More" button based on total results.
         */
        function updateLoadMoreButton(displayedCount) {
            loadMoreContainer.innerHTML = ''; // Clear previous button
            
            if (displayedCount < totalResults) {
                // There are more results to show
                loadMoreContainer.innerHTML = `
                    <div class="load-more">
                        <button id="loadMoreBtn" onclick="loadMore()">Load More</button>
                    </div>
                `;
            }
        }
        
        /**
         * Displays an error message.
         */
        function showError(message) {
            errorMessage.innerHTML = `<div class="error">${message}</div>`;
        }
        
        /**
         * Clears the error message.
         */
        function clearError() {
            errorMessage.innerHTML = "";
        }
        
        /**
         * Formats large numbers (e.g., 1500 -> 1.5k).
         */
        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num;
        }
    </script>
</body>
</html>
